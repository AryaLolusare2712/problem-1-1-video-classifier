# Commands execute from the repository root.
setup_commands:
  - "pip install -r requirements.txt"
run_commands:
  - "python src/main.py --help"
test_commands:
  - "python -m unittest discover -s tests -v"
notes: "Training and real-video inference require a labelled corpus. Do not report unmeasured accuracy. First inference downloads pretrained torchvision weights."
